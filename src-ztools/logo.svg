<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 背景圆 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" />

  <!-- 地球网格线 -->
  <ellipse cx="64" cy="64" rx="28" ry="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <ellipse cx="64" cy="64" rx="28" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <ellipse cx="64" cy="64" rx="12" ry="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <line x1="36" y1="64" x2="92" y2="64" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <line x1="64" y1="36" x2="64" y2="92" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- 字母 W -->
  <text x="64" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="white" letter-spacing="1">
    W
  </text>

  <!-- 底部小标签 -->
  <rect x="38" y="82" width="52" height="12" rx="6" fill="rgba(255,255,255,0.2)" />
  <text x="64" y="91" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.8)" letter-spacing="0.5">
    LAUNCHER
  </text>
</svg>
